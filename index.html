<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>App Signup</title>
  <style>
    body {
      font-family: serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 40px;
    }

    h1 {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    p {
      font-size: 14px;
      margin-bottom: 24px;
    }

    .form-container {
      border: 1.5px solid #888;
      border-radius: 8px;
      padding: 30px 40px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 260px;
    }

    .form-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }

    .form-row input {
      border: 1px solid #777;
      padding: 3px 6px;
      width: 140px;
      font-size: 13px;
    }

    .btn-container {
      margin-top: 10px;
    }

    button {
      background-color: #5587d6;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 13px;
    }

    button:hover {
      background-color: #4272be;
    }
  </style>
</head>
<body>

  <h1>Hi User, Welcome to our App!</h1>
  <p>You can sign up to the platform to access all important notifications.</p>

  <form class="form-container" action="/signup" method="POST">
    <div class="form-row">
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" placeholder="johndoe@email.com" required>
    </div>

    <div class="form-row">
      <label for="username">Username:</label>
      <input type="text" id="username" name="username" placeholder="John Doe" required>
    </div>

    <div class="form-row">
      <label for="password">Password:</label>
      <input type="password" id="password" name="password" placeholder="password" required>
    </div>

    <div class="btn-container">
      <button type="submit">Sign up</button>
    </div>
  </form>

</body>
</html>
